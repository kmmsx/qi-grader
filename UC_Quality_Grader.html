<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Uptime Assist — Quality Index Grader</title>
<style>
  :root {
    --navy: #002B5C;
    --blue: #1B4F8A;
    --blue-light: #D6E4F0;
    --gold: #C5982B;
    --gold-light: #FFF3CD;
    --white: #ffffff;
    --gray-50: #F8F8F8;
    --gray-100: #F0F0F0;
    --gray-200: #E0E0E0;
    --gray-400: #999999;
    --gray-600: #555555;
    --gray-800: #222222;
    --green: #1E7E34;
    --green-light: #E8F5E9;
    --red: #C0392B;
    --red-light: #FDECEA;
    --amber: #E67E22;
    --amber-light: #FEF3E2;
    --font: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: var(--font); background: var(--gray-50); color: var(--gray-800); font-size: 14px; }

  /* ── Layout ── */
  #app { display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
  .topbar { background: var(--navy); color: white; padding: 10px 20px; display: flex; align-items: center; justify-content: space-between; flex-shrink: 0; }
  .topbar h1 { font-size: 15px; font-weight: 600; letter-spacing: 0.02em; }
  .topbar .meta { font-size: 11px; opacity: 0.7; margin-top: 1px; }
  .topbar-right { display: flex; gap: 8px; align-items: center; }
  .main { display: grid; grid-template-columns: 300px 1fr; flex: 1; overflow: hidden; }

  /* ── Setup banner ── */
  #setup-banner { background: var(--gold-light); border-bottom: 1px solid var(--gold); padding: 10px 20px; display: flex; align-items: center; gap: 12px; font-size: 12px; color: var(--gray-800); flex-shrink: 0; }
  #setup-banner a { color: var(--blue); font-weight: 600; }
  #setup-banner input { padding: 4px 8px; border: 1px solid var(--gray-200); border-radius: 4px; font-size: 12px; width: 340px; }
  #setup-banner button { padding: 4px 10px; background: var(--navy); color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 12px; }
  #setup-banner.connected { background: var(--green-light); border-color: var(--green); }
  .conn-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--amber); flex-shrink: 0; }
  .conn-dot.ok { background: var(--green); }

  /* ── Queue panel ── */
  .queue-panel { border-right: 1px solid var(--gray-200); overflow-y: auto; background: white; display: flex; flex-direction: column; }
  .queue-header { padding: 12px 14px 8px; border-bottom: 1px solid var(--gray-200); flex-shrink: 0; }
  .queue-header h3 { font-size: 12px; font-weight: 600; color: var(--gray-600); text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 6px; }
  .progress-wrap { margin-bottom: 6px; }
  .progress-bar { height: 4px; background: var(--gray-100); border-radius: 2px; overflow: hidden; }
  .progress-fill { height: 100%; background: var(--green); border-radius: 2px; transition: width 0.3s; }
  .progress-label { font-size: 11px; color: var(--gray-400); margin-top: 3px; }
  .filter-tabs { display: flex; gap: 4px; }
  .ftab { font-size: 11px; padding: 3px 9px; border-radius: 20px; border: 1px solid var(--gray-200); background: white; cursor: pointer; color: var(--gray-600); transition: all 0.1s; }
  .ftab.active { background: var(--navy); color: white; border-color: var(--navy); }
  .coach-group { border-bottom: 1px solid var(--gray-100); }
  .coach-label { font-size: 10px; font-weight: 700; color: var(--gray-400); text-transform: uppercase; letter-spacing: 0.08em; padding: 8px 14px 4px; background: var(--gray-50); display: flex; justify-content: space-between; align-items: center; }
  .coach-count { font-size: 10px; color: var(--gray-400); font-weight: 400; }
  .queue-item { padding: 8px 14px; cursor: pointer; border-bottom: 1px solid var(--gray-100); transition: background 0.1s; display: grid; grid-template-columns: 1fr auto; gap: 4px; align-items: start; }
  .queue-item:hover { background: var(--blue-light); }
  .queue-item.active { background: var(--blue-light); border-left: 3px solid var(--navy); }
  .queue-item.graded { opacity: 0.55; }
  .qi-ro { font-size: 12px; font-weight: 600; color: var(--gray-800); }
  .qi-detail { font-size: 11px; color: var(--gray-600); margin-top: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 180px; }
  .qi-status { font-size: 10px; padding: 2px 6px; border-radius: 20px; white-space: nowrap; margin-top: 2px; }
  .status-pending { background: var(--gray-100); color: var(--gray-600); }
  .status-graded { background: var(--green-light); color: var(--green); }

  /* ── Grading panel ── */
  .grade-panel { overflow-y: auto; display: flex; flex-direction: column; }
  .empty-state { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; color: var(--gray-400); gap: 8px; }
  .empty-state svg { opacity: 0.3; }
  .empty-state p { font-size: 13px; }

  /* RO detail section */
  .ro-detail { padding: 16px 20px 0; border-bottom: 1px solid var(--gray-200); }
  .ro-title-row { display: flex; align-items: center; gap: 12px; margin-bottom: 10px; }
  .ro-number { font-size: 18px; font-weight: 700; color: var(--navy); }
  .ro-badge { font-size: 11px; padding: 3px 8px; border-radius: 20px; font-weight: 500; }
  .badge-escalated { background: var(--red-light); color: var(--red); }
  .badge-offpace { background: var(--amber-light); color: var(--amber); }
  .badge-standard { background: var(--green-light); color: var(--green); }
  .badge-default { background: var(--gray-100); color: var(--gray-600); }
  .ro-meta-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 12px; }
  .meta-item .lbl { font-size: 10px; color: var(--gray-400); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 2px; }
  .meta-item .val { font-size: 12px; font-weight: 500; color: var(--gray-800); }
  .fields-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding-bottom: 16px; }
  .field-block .fl { font-size: 10px; color: var(--gray-400); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 3px; font-weight: 600; }
  .field-block .fv { font-size: 12px; color: var(--gray-800); line-height: 1.5; background: var(--gray-50); border: 1px solid var(--gray-200); border-radius: 5px; padding: 7px 9px; min-height: 34px; max-height: 120px; overflow-y: auto; }
  .field-block.full { grid-column: 1 / -1; }
  .field-block .fv.empty { color: var(--gray-400); font-style: italic; }

  /* Scoring section */
  .scoring-section { padding: 16px 20px; }
  .scoring-section h3 { font-size: 12px; font-weight: 700; color: var(--gray-600); text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 12px; }
  .criteria-list { display: flex; flex-direction: column; gap: 10px; margin-bottom: 16px; }
  .criterion { background: white; border: 1px solid var(--gray-200); border-radius: 8px; padding: 10px 12px; }
  .crit-header { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 4px; }
  .crit-name { font-size: 13px; font-weight: 600; color: var(--gray-800); }
  .crit-weight { font-size: 11px; color: var(--gray-400); }
  .crit-desc { font-size: 11px; color: var(--gray-600); line-height: 1.5; margin-bottom: 8px; }
  .score-btns { display: flex; gap: 5px; align-items: center; }
  .sbtn { width: 36px; height: 32px; border-radius: 5px; border: 1px solid var(--gray-200); background: var(--gray-50); font-size: 12px; font-weight: 600; cursor: pointer; transition: all 0.1s; color: var(--gray-600); display: flex; align-items: center; justify-content: center; }
  .sbtn:hover { border-color: var(--navy); color: var(--navy); background: var(--blue-light); }
  .sbtn.sel-1, .sbtn.sel-2 { background: var(--red-light); border-color: #F09595; color: var(--red); }
  .sbtn.sel-3 { background: var(--amber-light); border-color: #EF9F27; color: var(--amber); }
  .sbtn.sel-4, .sbtn.sel-5 { background: var(--green-light); border-color: #97C459; color: var(--green); }
  .score-hint { font-size: 10px; color: var(--gray-400); margin-left: 8px; }

  /* QI calc bar */
  .qi-bar { display: flex; align-items: center; justify-content: space-between; background: var(--navy); color: white; border-radius: 8px; padding: 12px 16px; margin-bottom: 14px; }
  .qi-number { font-size: 28px; font-weight: 700; }
  .qi-label-small { font-size: 11px; opacity: 0.7; margin-top: 1px; }
  .qi-breakdown { display: flex; gap: 8px; flex-wrap: wrap; }
  .qi-chip { font-size: 10px; background: rgba(255,255,255,0.12); padding: 2px 7px; border-radius: 20px; }
  .qi-chip.unset { opacity: 0.4; }

  /* Notes + submit */
  .notes-row { margin-bottom: 14px; }
  .notes-row label { font-size: 11px; color: var(--gray-600); font-weight: 600; display: block; margin-bottom: 4px; }
  .notes-row textarea { width: 100%; font-family: var(--font); font-size: 12px; border: 1px solid var(--gray-200); border-radius: 6px; padding: 8px 10px; resize: vertical; min-height: 64px; background: white; color: var(--gray-800); outline: none; }
  .notes-row textarea:focus { border-color: var(--navy); }
  .submit-row { display: flex; gap: 8px; align-items: center; padding-bottom: 24px; }
  .btn-submit { padding: 10px 24px; background: var(--navy); color: white; border: none; border-radius: 6px; font-size: 13px; font-weight: 600; cursor: pointer; transition: all 0.15s; }
  .btn-submit:hover { background: var(--blue); }
  .btn-submit:disabled { opacity: 0.4; cursor: not-allowed; }
  .btn-submit.saving { background: var(--amber); }
  .btn-submit.saved { background: var(--green); }
  .submit-msg { font-size: 12px; color: var(--gray-400); }

  /* Top buttons */
  .btn-top { padding: 5px 12px; font-size: 11px; border-radius: 5px; border: 1px solid rgba(255,255,255,0.3); background: transparent; color: white; cursor: pointer; transition: all 0.1s; }
  .btn-top:hover { background: rgba(255,255,255,0.15); }

  /* Grader select */
  .grader-select { font-size: 11px; padding: 4px 8px; border-radius: 5px; border: 1px solid rgba(255,255,255,0.3); background: transparent; color: white; cursor: pointer; }
  .grader-select option { color: var(--gray-800); background: white; }

  /* Toast */
  #toast { position: fixed; bottom: 20px; right: 20px; background: var(--gray-800); color: white; padding: 10px 16px; border-radius: 6px; font-size: 12px; opacity: 0; transform: translateY(10px); transition: all 0.2s; pointer-events: none; z-index: 999; }
  #toast.show { opacity: 1; transform: translateY(0); }
  #toast.error { background: var(--red); }
  #toast.success { background: var(--green); }
</style>
</head>

<div id="app">

  <!-- Top bar -->
  <div class="topbar">
    <div>
      <div class="h1-wrap" style="display:flex;align-items:center;gap:10px">
        <h1>Uptime Assist — Quality Index Grader</h1>
        <span style="font-size:11px;opacity:0.5;font-weight:400">Initial batch · 80 ROs · 10 per coach</span>
      </div>
    </div>
    <div class="topbar-right">
      <label style="font-size:11px;opacity:0.7;color:white">Grading as:</label>
      <select class="grader-select" id="grader-select">
        <option value="Kurt (You)">Kurt (You)</option>
        <option value="Manager">Manager</option>
      </select>
      <button class="btn-top" onclick="exportCSV()">Export CSV</button>
    </div>
  </div>

  <!-- Setup banner -->
  <div id="setup-banner">
    <div class="conn-dot" id="conn-dot"></div>

    <span style="color:var(--gray-400);margin-left:4px">·</span>
    <a href="#" onclick="showSetupGuide();return false;">Setup guide</a>
  </div>

  <!-- Main -->
  <div class="main">

    <!-- Queue -->
    <div class="queue-panel">
      <div class="queue-header">

        </div>
        <div class="filter-tabs">

          <button class="ftab" onclick="setFilter('pending',this)">Pending</button>
          <button class="ftab" onclick="setFilter('graded',this)">Graded</button>
        </div>
      </div>
      <div id="queue-list"></div>
    </div>

    <!-- Grading panel -->
    <div class="grade-panel" id="grade-panel">
      <div class="empty-state">
        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M9 9h6M9 12h6M9 15h4"/></svg>
        <p>Select a submission from the queue to begin grading</p>
      </div>
    </div>

  </div>
</div>

const CRITERIA = [
  {key:'accuracy',name:'Accuracy',weight:0.25,desc:'Internal consistency: completed status matches closed date, days to repair, and RO Closed flag.'},
  {key:'completeness',name:'Completeness',weight:0.20,desc:'Required fields filled — services needed, responsibility, initial visit summary, UC work, delay category, repair summary.'},
  {key:'clarity',name:'Clarity',weight:0.15,desc:'Visit summaries are specific, well-structured, and clearly describe what the coach observed and did.'},
  {key:'timeliness',name:'Timeliness',weight:0.15,desc:'Initial visit was made promptly after RO opened. Entries are dated and follow a logical sequence.'},
  {key:'evidence',name:'Evidence',weight:0.15,desc:'Supporting documentation present — GTAC, COPIS, part numbers, tech line cases where appropriate.'},
  {key:'actionability',name:'Actionability',weight:0.10,desc:'UC interventions are clearly documented with specific actions taken and next steps or outcomes noted.'}
];

const SCORE_LABELS = {1:'Poor',2:'Below std',3:'Acceptable',4:'Good',5:'Excellent'};

let scores = {};
let currentIdx = null;
let filter = 'all';
let sheetUrl = localStorage.getItem('qi_sheet_url') || '';

function init() {
  if (sheetUrl) {
    document.getElementById('sheet-url').value = sheetUrl;
    updateConnectionStatus(true);
  }
  loadSavedScores();
  renderQueue();
  updateProgress();
}

function loadSavedScores() {
  const saved = localStorage.getItem('qi_scores');
  if (saved) {
    try { scores = JSON.parse(saved); } catch(e) { scores = {}; }
  }
}

function saveLocalScores() {
  localStorage.setItem('qi_scores', JSON.stringify(scores));
}

function updateProgress() {
  const total = ROS.length;
  const graded = Object.keys(scores).length;
  const pct = Math.round(graded / total * 100);
  document.getElementById('progress-fill').style.width = pct + '%';
  document.getElementById('progress-label').textContent = `${graded} / ${total} graded`;
}

function setFilter(f, btn) {
  filter = f;
  document.querySelectorAll('.ftab').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  renderQueue();
}

function renderQueue() {
  const list = document.getElementById('queue-list');
  const coaches = [...new Set(ROS.map(r => r.coach))];
  let html = '';
  coaches.forEach(coach => {
    const coachROs = ROS.map((r,i) => ({...r, _idx:i})).filter(r => r.coach === coach);
    const visible = coachROs.filter(r => {
      if (filter === 'pending') return !scores[r['RO#']];
      if (filter === 'graded') return !!scores[r['RO#']];
      return true;
    });
    if (visible.length === 0) return;
    const gradedCount = coachROs.filter(r => scores[r['RO#']]).length;
    html += `<div class="coach-group">
      <div class="coach-label">${coach}<span class="coach-count">${gradedCount}/${coachROs.length}</span></div>`;
    visible.forEach(r => {
      const isGraded = !!scores[r['RO#']];
      const isActive = currentIdx === r._idx;
      const qi = isGraded ? scores[r['RO#']].qi.toFixed(0) : '';
      html += `<div class="queue-item${isActive?' active':''}${isGraded?' graded':''}" onclick="selectRO(${r._idx})">
        <div>
          <div class="qi-ro">RO #${r['RO#']}</div>
          <div class="qi-detail">${r.Model} · ${r['Dealer Name']}</div>
        </div>
        <div style="text-align:right">
          ${isGraded ? `<div style="font-size:13px;font-weight:700;color:var(--navy)">${qi}</div>` : ''}
          <div class="qi-status ${isGraded?'status-graded':'status-pending'}">${isGraded?'Graded':'Pending'}</div>
        </div>
      </div>`;
    });
    html += '</div>';
  });
  list.innerHTML = html;
}

function selectRO(idx) {
  currentIdx = idx;
  renderQueue();
  renderGradePanel();
}

    }
    criteriaHtml += `<div class="criterion" id="crit-${c.key}">
      <div class="crit-header">
        <span class="crit-name">${c.name}</span>

      <div class="crit-desc">${c.desc}</div>

      </div>

  const qiDisplay = qi !== null ? qi.toFixed(1) : '—';

  panel.innerHTML = `
    <div class="ro-detail">

        <span class="ro-number">RO #${escHtml(ro['RO#'])}</span>

        <span style="font-size:11px;color:var(--gray-400);margin-left:auto">${escHtml(ro.coach)}</span>
      </div>
      <div class="ro-meta-grid">
        <div class="meta-item"><div class="lbl">Dealer</div><div class="val">${escHtml(ro['Dealer Name'])}</div></div>
        <div class="meta-item"><div class="lbl">Model</div><div class="val">${escHtml(ro.Model)}</div></div>
        <div class="meta-item"><div class="lbl">RO opened</div><div class="val">${escHtml(ro['RO Open Date'])}</div></div>
        <div class="meta-item"><div class="lbl">Repair complete</div><div class="val">${escHtml(ro['Repair Completed?'])} ${ro['RO Closed Date']?'· '+ro['RO Closed Date']:''}</div></div>
      </div>
      <div class="fields-grid">
        <div class="field-block">
          <div class="fl">Services needed</div>
          ${fv(ro['Services Needed Detail'],'Not specified')}
        </div>
        <div class="field-block">
          <div class="fl">Delay category</div>
          ${fv(ro['Primary Repair Delay Category'],'Not specified')}
        </div>
        <div class="field-block full">
          <div class="fl">Initial visit (${escHtml(ro['Initial Visit Date Regarding This VIN']||'—')})</div>
          ${fv(ro['Initial Visit Summary and UC Work Details'],'No initial visit summary entered')}
        </div>
        ${ro['2nd Visit Date'] ? `<div class="field-block full"><div class="fl">2nd visit (${escHtml(ro['2nd Visit Date'])})</div>${fv(ro['Second Visit Summary and UC Work'])}</div>` : ''}
        ${ro['3rd Visit Date'] ? `<div class="field-block full"><div class="fl">3rd visit (${escHtml(ro['3rd Visit Date'])})</div>${fv(ro['Third Visit Summary and UC Work'])}</div>` : ''}
        ${ro['Continued Visit Dates and Summary'] ? `<div class="field-block full"><div class="fl">Continued visits</div>${fv(ro['Continued Visit Dates and Summary'])}</div>` : ''}
        <div class="field-block full">
          <div class="fl">UC work & interventions</div>
          ${fv(ro['UC Work and Interventions'],'None recorded')}
        </div>

function setScore(key, val, btn) {
  const ro = ROS[currentIdx];
  if (!scores[ro['RO#']]) scores[ro['RO#']] = {};
  scores[ro['RO#']][key] = val;

  // Update button styles
  const crit = document.getElementById('crit-'+key);
  crit.querySelectorAll('.sbtn').forEach((b,i) => {
    b.className = 'sbtn' + (i+1===val ? ' sel-'+val : '');
  });
  document.getElementById('hint-'+key).textContent = SCORE_LABELS[val];

  // Update QI display
  const qi = calcQI(scores[ro['RO#']]);
  document.getElementById('qi-display').textContent = qi !== null ? qi.toFixed(1) : '—';
  document.getElementById('chip-'+key).textContent = key.slice(0,3).charAt(0).toUpperCase()+key.slice(0,3).slice(1)+': '+val;
  document.getElementById('chip-'+key).classList.remove('unset');
}

function calcQI(s) {
  const allSet = CRITERIA.every(c => s[c.key]);
  if (!allSet) return null;
  return CRITERIA.reduce((sum,c) => sum + s[c.key] * c.weight, 0) / 5 * 100;
}

async function submitScore() {
  const ro = ROS[currentIdx];
  const s = scores[ro['RO#']] || {};
  const qi = calcQI(s);
  if (!qi) {
    showToast('Score all 6 criteria before saving', 'error');
    return;
  }
  const grader = document.getElementById('grader-select').value;
  const notes = document.getElementById('grader-notes').value;

  scores[ro['RO#']] = {...s, qi, notes, gradedBy: grader, gradedAt: new Date().toISOString()};
  saveLocalScores();

  const btn = document.getElementById('submit-btn');
  btn.textContent = 'Saving...';
  btn.classList.add('saving');
  btn.disabled = true;

  let sheetOk = false;
  if (sheetUrl) {
    sheetOk = await postToSheet({
      timestamp: new Date().toISOString(),
      gradedBy: grader,
      roNumber: ro['RO#'],
      coach: ro.coach,
      dealer: ro['Dealer Name'],
      model: ro.Model,
      uaStatus: ro['UA Status'],
      roOpenDate: ro['RO Open Date'],
      repairCompleted: ro['Repair Completed?'],
      scoreAccuracy: s.accuracy,
      scoreCompleteness: s.completeness,
      scoreClarity: s.clarity,
      scoreTimeliness: s.timeliness,
      scoreEvidence: s.evidence,
      scoreActionability: s.actionability,
      qualityIndex: qi.toFixed(1),
      notes
    });
  }

  updateProgress();
  renderQueue();

  btn.textContent = sheetOk ? 'Saved to Sheet!' : 'Saved locally';
  btn.classList.remove('saving');
  btn.classList.add('saved');
  document.getElementById('submit-msg').textContent = `${qi.toFixed(1)}/100 · ${grader}${!sheetUrl?' · Connect Google Sheets to sync':''}`;

  showToast(sheetOk ? 'Score saved to Google Sheets' : 'Saved locally — connect Sheets to sync', sheetOk ? 'success' : '');

  setTimeout(() => {
    btn.textContent = 'Save score';
    btn.classList.remove('saved');
    btn.disabled = false;
    // Auto-advance to next pending
    const nextIdx = ROS.findIndex((r,i) => i > currentIdx && !scores[r['RO#']]);
    if (nextIdx !== -1) { currentIdx = nextIdx; renderQueue(); renderGradePanel(); }
  }, 1800);
}

async function postToSheet(data) {
  try {
    await fetch(sheetUrl, {
      method: 'POST',
      mode: 'no-cors',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify(data)
    });
    return true;
  } catch(e) {
    return false;
  }
}

function saveSheetUrl() {
  const val = document.getElementById('sheet-url').value.trim();
  if (!val.startsWith('https://script.google.com')) {
    showToast('Paste a valid Apps Script URL (starts with https://script.google.com)', 'error');
    return;
  }
  sheetUrl = val;
  localStorage.setItem('qi_sheet_url', sheetUrl);
  updateConnectionStatus(true);
  showToast('Connected! Scores will now sync to your Google Sheet.', 'success');
}

function updateConnectionStatus(connected) {
  const banner = document.getElementById('setup-banner');
  const dot = document.getElementById('conn-dot');
  const status = document.getElementById('conn-status');
  if (connected) {
    banner.classList.add('connected');
    dot.classList.add('ok');
    status.textContent = 'Connected to Google Sheets.';
  } else {
    banner.classList.remove('connected');
    dot.classList.remove('ok');
    status.textContent = 'Not connected to Google Sheets.';
  }
}

function exportCSV() {
  const gradedROs = ROS.filter(r => scores[r['RO#']]);
  if (gradedROs.length === 0) {
    showToast('No scores to export yet', 'error');
    return;
  }
  const headers = ['RO#','Coach','Dealer','Model','UA Status','RO Open Date','Repair Completed','Accuracy','Completeness','Clarity','Timeliness','Evidence','Actionability','Quality Index','Graded By','Graded At','Notes'];
  const rows = gradedROs.map(r => {
    const s = scores[r['RO#']];
    return [r['RO#'],r.coach,r['Dealer Name'],r.Model,r['UA Status'],r['RO Open Date'],r['Repair Completed?'],
      s.accuracy,s.completeness,s.clarity,s.timeliness,s.evidence,s.actionability,
      s.qi?s.qi.toFixed(1):'',s.gradedBy||'',s.gradedAt||'',s.notes||''];
  });
  const csv = [headers, ...rows].map(r => r.map(v => `"${(v+'').replace(/"/g,'""')}"`).join(',')).join('\n');
  const a = document.createElement('a');
  a.href = 'data:text/csv;charset=utf-8,' + encodeURIComponent(csv);
  a.download = 'UC_Quality_Scores_' + new Date().toISOString().slice(0,10) + '.csv';
  a.click();
  showToast(`Exported ${gradedROs.length} scores`, 'success');
}

function escHtml(s) {
  return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function showToast(msg, type) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'show' + (type ? ' '+type : '');
  clearTimeout(t._timer);
  t._timer = setTimeout(() => t.className = '', 3000);
}

init();
</script>
</body>
</html>
